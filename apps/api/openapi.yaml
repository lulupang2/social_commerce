{
  "openapi": "3.1.0",
  "info": {
    "title": "SummerGear Go API",
    "version": "0.4.0",
    "description": "Go service-session authentication, Go-owned listings, and private listing image lifecycle. Social provider credentials and Storage credentials may remain disabled in isolated test environments; dev-login is test-only."
  },
  "paths": {
    "/health/live": {
      "get": {
        "operationId": "liveness",
        "responses": {
          "200": {
            "description": "Process is alive.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HealthLive"
                }
              }
            }
          }
        }
      }
    },
    "/health/ready": {
      "get": {
        "operationId": "readiness",
        "responses": {
          "200": {
            "description": "Database, auth tables, listings tables, listing image metadata, and River foundation are ready.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HealthReady"
                }
              }
            }
          },
          "503": {
            "description": "Service is not ready.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/auth/providers": {
      "get": {
        "operationId": "authProviders",
        "responses": {
          "200": {
            "description": "Provider configuration status without credential values.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ProvidersResponse"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/auth/session": {
      "get": {
        "operationId": "authSession",
        "responses": {
          "200": {
            "description": "Current service session.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SessionView"
                }
              }
            }
          },
          "401": {
            "description": "No valid service session.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/auth/dev-login": {
      "post": {
        "operationId": "authDevLogin",
        "description": "Test-only login. The route is registered only when AUTH_DEV_LOGIN_ENABLED=true.",
        "responses": {
          "200": {
            "description": "Test member service session created or rotated.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SessionView"
                }
              }
            }
          },
          "403": {
            "description": "Origin rejected.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/auth/logout": {
      "post": {
        "operationId": "authLogout",
        "parameters": [
          {
            "$ref": "#/components/parameters/CSRFToken"
          }
        ],
        "responses": {
          "204": {
            "description": "Current service session revoked."
          },
          "401": {
            "description": "No valid service session.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Origin or CSRF rejected.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/auth/logout-all": {
      "post": {
        "operationId": "authLogoutAll",
        "parameters": [
          {
            "$ref": "#/components/parameters/CSRFToken"
          }
        ],
        "responses": {
          "204": {
            "description": "All member service sessions revoked after recent reauthentication."
          },
          "403": {
            "description": "Reauthentication, origin, or CSRF requirement not met.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/auth/reauthenticate": {
      "post": {
        "operationId": "authReauthenticate",
        "parameters": [
          {
            "$ref": "#/components/parameters/CSRFToken"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ReauthenticateRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Provider authorization URL for reauthentication.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuthorizationResponse"
                }
              }
            }
          },
          "401": {
            "description": "No valid service session.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/auth/{provider}/start": {
      "get": {
        "operationId": "authStart",
        "parameters": [
          {
            "$ref": "#/components/parameters/Provider"
          },
          {
            "name": "returnTo",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "pattern": "^/[A-Za-z0-9/_-]*$"
            }
          }
        ],
        "responses": {
          "303": {
            "description": "Redirect to the configured provider."
          },
          "503": {
            "description": "Provider is not configured.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/auth/{provider}/callback": {
      "get": {
        "operationId": "authCallback",
        "parameters": [
          {
            "$ref": "#/components/parameters/Provider"
          }
        ],
        "responses": {
          "303": {
            "description": "Return to the allowed application path with success or static error code."
          },
          "400": {
            "description": "Invalid state, browser binding, or provider response.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/listings": {
      "get": {
        "operationId": "listListings",
        "parameters": [
          {
            "name": "sport",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "surf",
                "tennis"
              ]
            }
          },
          {
            "name": "category",
            "in": "query",
            "schema": {
              "$ref": "#/components/schemas/ListingCategory"
            }
          },
          {
            "name": "search",
            "in": "query",
            "schema": {
              "type": "string",
              "maxLength": 120
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Public active Go-owned listings.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ListingList"
                }
              }
            }
          },
          "400": {
            "description": "Invalid filter.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      },
      "post": {
        "operationId": "createListing",
        "parameters": [
          {
            "$ref": "#/components/parameters/CSRFToken"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CreateListingRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Pending-review listing owned by the authenticated member.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Listing"
                }
              }
            }
          },
          "401": {
            "description": "Authentication required.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Origin or CSRF rejected.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/listings/{id}": {
      "get": {
        "operationId": "getListing",
        "parameters": [
          {
            "$ref": "#/components/parameters/ListingID"
          }
        ],
        "responses": {
          "200": {
            "description": "Active listing, or the authenticated owner's own non-public listing.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Listing"
                }
              }
            }
          },
          "404": {
            "description": "Not found or not visible to this requester.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      },
      "patch": {
        "operationId": "updateListing",
        "parameters": [
          {
            "$ref": "#/components/parameters/ListingID"
          },
          {
            "$ref": "#/components/parameters/CSRFToken"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/UpdateListingRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Owner-updated draft, pending-review, or rejected listing.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Listing"
                }
              }
            }
          },
          "404": {
            "description": "Not found or not owned by this member.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/listings/{id}/images": {
      "get": {
        "operationId": "listListingImages",
        "description": "Returns fresh private Storage signed URLs for images on an active listing, or on the authenticated owner's own non-public listing. Raw storage paths are never returned.",
        "parameters": [
          {
            "$ref": "#/components/parameters/ListingID"
          }
        ],
        "responses": {
          "200": {
            "description": "Images sorted by sortOrder. Individual missing/signing failures are represented as unavailable image states.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ListingImagesResponse"
                }
              }
            }
          },
          "404": {
            "description": "Listing is absent or hidden from this requester.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Image metadata or the Storage signing service is unavailable.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      },
      "post": {
        "operationId": "createListingImage",
        "description": "Owner-only image upload for draft, pending-review, or rejected listings. The Go service uploads to the existing private listing-images bucket with server-only credentials.",
        "parameters": [
          {
            "$ref": "#/components/parameters/ListingID"
          },
          {
            "$ref": "#/components/parameters/CSRFToken"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "multipart/form-data": {
              "schema": {
                "$ref": "#/components/schemas/ListingImageCreateRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Image uploaded and metadata created.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ListingImage"
                }
              }
            }
          },
          "400": {
            "description": "Invalid multipart, metadata, dimensions, or sort order.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Authentication required.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Origin or CSRF validation failed.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Listing is absent or not owned by this member.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Image limit, sort conflict, or listing state conflict.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "413": {
            "description": "Image file exceeds 10 MiB.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "415": {
            "description": "Declared or actual image media type is unsupported.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Storage or image metadata database is unavailable.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/listings/{id}/images/{imageId}": {
      "patch": {
        "operationId": "updateListingImageMetadata",
        "description": "Owner-only alt text and/or sort-order update. The image object itself is unchanged.",
        "parameters": [
          {
            "$ref": "#/components/parameters/ListingID"
          },
          {
            "$ref": "#/components/parameters/ImageID"
          },
          {
            "$ref": "#/components/parameters/CSRFToken"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ListingImagePatchRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Image metadata updated.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ListingImage"
                }
              }
            }
          },
          "400": {
            "description": "Invalid metadata or sort order.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Authentication required.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Origin or CSRF validation failed.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Listing is hidden/not owned, or image is absent within the accessible listing.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Sort or listing state conflict.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Storage signing or image metadata database is unavailable.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      },
      "put": {
        "operationId": "replaceListingImage",
        "description": "Owner-only binary replacement. A new private object key is uploaded, metadata is atomically switched, then the old object is best-effort cleaned up while preserving the image ID and sort order.",
        "parameters": [
          {
            "$ref": "#/components/parameters/ListingID"
          },
          {
            "$ref": "#/components/parameters/ImageID"
          },
          {
            "$ref": "#/components/parameters/CSRFToken"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "multipart/form-data": {
              "schema": {
                "$ref": "#/components/schemas/ListingImageReplaceRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Image binary replaced.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ListingImage"
                }
              }
            }
          },
          "400": {
            "description": "Invalid multipart, metadata, or dimensions.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Authentication required.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Origin or CSRF validation failed.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Listing is hidden/not owned, or image is absent.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Listing state or concurrent replacement conflict.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "413": {
            "description": "Image file exceeds 10 MiB.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "415": {
            "description": "Declared or actual image media type is unsupported.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Storage or image metadata database is unavailable.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      },
      "delete": {
        "operationId": "deleteListingImage",
        "description": "Owner-only deletion. Storage is deleted first; object-not-found is retry-safe, then metadata is deleted.",
        "parameters": [
          {
            "$ref": "#/components/parameters/ListingID"
          },
          {
            "$ref": "#/components/parameters/ImageID"
          },
          {
            "$ref": "#/components/parameters/CSRFToken"
          }
        ],
        "responses": {
          "204": {
            "description": "Image deleted; no response body."
          },
          "400": {
            "description": "Unexpected request body.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Authentication required.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Origin or CSRF validation failed.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Listing is hidden/not owned, or image is absent.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Listing state or concurrent replacement conflict.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Storage or image metadata database is unavailable.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "parameters": {
      "Provider": {
        "name": "provider",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "enum": [
            "naver",
            "kakao"
          ]
        }
      },
      "ListingID": {
        "name": "id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "CSRFToken": {
        "name": "X-CSRF-Token",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string"
        }
      },
      "ImageID": {
        "name": "imageId",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "required": [
          "code",
          "message",
          "requestId"
        ],
        "additionalProperties": false,
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "requestId": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          }
        }
      },
      "HealthLive": {
        "type": "object",
        "required": [
          "status"
        ],
        "additionalProperties": false,
        "properties": {
          "status": {
            "type": "string",
            "const": "ok"
          }
        }
      },
      "HealthReady": {
        "type": "object",
        "required": [
          "status"
        ],
        "additionalProperties": false,
        "properties": {
          "status": {
            "type": "string",
            "const": "ready"
          }
        }
      },
      "ProviderStatus": {
        "type": "object",
        "required": [
          "provider",
          "enabled",
          "missing"
        ],
        "additionalProperties": false,
        "properties": {
          "provider": {
            "type": "string",
            "enum": [
              "naver",
              "kakao"
            ]
          },
          "enabled": {
            "type": "boolean"
          },
          "missing": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        }
      },
      "ProvidersResponse": {
        "type": "object",
        "required": [
          "providers"
        ],
        "additionalProperties": false,
        "properties": {
          "providers": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ProviderStatus"
            }
          }
        }
      },
      "Member": {
        "type": "object",
        "required": [
          "id",
          "displayName",
          "email",
          "onboarded"
        ],
