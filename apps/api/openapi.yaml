{
  "openapi": "3.1.0",
  "info": {
    "title": "SummerGear Go API",
    "version": "0.6.0",
    "description": "Go service-session authentication, listings, and private listing image lifecycle. Social provider credentials and Storage credentials may remain disabled in isolated test environments."
  },
  "paths": {
    "/health/live": {
      "get": {
        "operationId": "liveness",
        "responses": {
          "200": {
            "description": "Process is alive.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HealthLive"
                }
              }
            }
          }
        }
      }
    },
    "/health/ready": {
      "get": {
        "operationId": "readiness",
        "responses": {
          "200": {
            "description": "Database, auth tables, listings tables, and River foundation are ready.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HealthReady"
                }
              }
            }
          },
          "503": {
            "description": "Service is not ready.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/auth/providers": {
      "get": {
        "operationId": "authProviders",
        "responses": {
          "200": {
            "description": "Provider configuration status without credential values.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ProvidersResponse"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/auth/session": {
      "get": {
        "operationId": "authSession",
        "responses": {
          "200": {
            "description": "Current service session.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SessionView"
                }
              }
            }
          },
          "401": {
            "description": "No valid service session.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/auth/dev-login": {
      "post": {
        "operationId": "authDevLogin",
        "description": "Test-only login. Optional role body is accepted only for isolated fixture DB roles; public preview keeps the no-body login.",
        "requestBody": { "required": false, "content": { "application/json": { "schema": {
          "type": "object", "required": ["role"], "additionalProperties": false,
          "properties": { "role": { "type": "string", "enum": ["buyer_a", "buyer_b", "seller_a", "seller_b", "reviewer"] } }
        } } } },
        "responses": {
          "200": {
            "description": "Test member service session created or rotated.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SessionView"
                }
              }
            }
          },
          "403": {
            "description": "Origin rejected.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/auth/logout": {
      "post": {
        "operationId": "authLogout",
        "parameters": [
          {
            "$ref": "#/components/parameters/CSRFToken"
          }
        ],
        "responses": {
          "204": {
            "description": "Current service session revoked."
          },
          "401": {
            "description": "No valid service session.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Origin or CSRF rejected.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/auth/logout-all": {
      "post": {
        "operationId": "authLogoutAll",
        "parameters": [
          {
            "$ref": "#/components/parameters/CSRFToken"
          }
        ],
        "responses": {
          "204": {
            "description": "All member service sessions revoked after recent reauthentication."
          },
          "403": {
            "description": "Reauthentication, origin, or CSRF requirement not met.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/auth/reauthenticate": {
      "post": {
        "operationId": "authReauthenticate",
        "parameters": [
          {
            "$ref": "#/components/parameters/CSRFToken"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ReauthenticateRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Provider authorization URL for reauthentication.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuthorizationResponse"
                }
              }
            }
          },
          "401": {
            "description": "No valid service session.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/auth/{provider}/start": {
      "get": {
        "operationId": "authStart",
        "parameters": [
          {
            "$ref": "#/components/parameters/Provider"
          },
          {
            "name": "returnTo",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "pattern": "^/[A-Za-z0-9/_-]*$"
            }
          }
        ],
        "responses": {
          "303": {
            "description": "Redirect to the configured provider."
          },
          "503": {
            "description": "Provider is not configured.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/auth/{provider}/callback": {
      "get": {
        "operationId": "authCallback",
        "parameters": [
          {
            "$ref": "#/components/parameters/Provider"
          }
        ],
        "responses": {
          "303": {
            "description": "Return to the allowed application path with success or static error code."
          },
          "400": {
            "description": "Invalid state, browser binding, or provider response.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/auth/fixture-roles": {
      "get": {
        "operationId": "fixtureRoles",
        "description": "Registered only with dev login in an isolated fixture test DB; never in public preview.",
        "responses": {
          "200": {
            "description": "Allowed fixture account roles.",
            "content": { "application/json": { "schema": {
              "type": "object", "required": ["roles"], "additionalProperties": false,
              "properties": { "roles": { "type": "array", "items": { "type": "string", "enum": ["buyer_a", "buyer_b", "seller_a", "seller_b", "reviewer"] } } }
            } } }
          }
        }
      }
    },
    "/api/v1/me": {
      "get": {
        "operationId": "getMemberProfile",
        "responses": {
          "200": { "description": "Current Go session member, skills, and visible saved/confirmed-order counts.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/MemberProfile" } } } },
          "401": { "description": "Session required.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "503": { "description": "Database unavailable.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      },
      "put": {
        "operationId": "updateMemberProfile",
        "parameters": [{ "$ref": "#/components/parameters/CSRFToken" }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/MemberProfileUpdate" } } } },
        "responses": {
          "200": { "description": "Saved member settings.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/MemberProfile" } } } },
          "400": { "description": "Invalid settings.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "401": { "description": "Session required.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "403": { "description": "Origin or CSRF rejected.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "503": { "description": "Database unavailable.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/api/v1/recommendations": {
      "get": { "operationId": "recommendPurchasableListings", "description": "Newest 200 active, seller-approved, in-stock listings form the candidate pool; return up to 12 scored by stored sport (4), matching listing skill (1), budget (2), and region (2). Score ties sort by publication time then ID descending. Anonymous or unset preferences get latest eligible items without fabricated reasons.", "responses": {
        "200": { "description": "Ranked eligible listings with only actual-match reasons.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/RecommendationList" } } } },
        "503": { "$ref": "#/components/responses/ServiceUnavailable" }
      } }
    },
    "/api/v1/me/listings": {
      "get": {
        "operationId": "myListings",
        "responses": {
          "200": { "description": "All statuses owned by current Go member, newest first.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PersonalListings" } } } },
          "401": { "description": "Session required.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "503": { "description": "Database or image signing unavailable.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/api/v1/me/favorites": {
      "get": {
        "operationId": "myFavorites",
        "responses": {
          "200": { "description": "Active Go listings saved by current member, newest favorite first.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PersonalListings" } } } },
          "401": { "description": "Session required.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "503": { "description": "Database or image signing unavailable.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/api/v1/me/favorites/{id}": {
      "parameters": [{ "$ref": "#/components/parameters/ListingID" }],
      "put": {
        "operationId": "saveFavorite",
        "parameters": [{ "$ref": "#/components/parameters/CSRFToken" }],
        "responses": {
          "200": { "description": "Current member saved an active Go listing.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/FavoriteResult" } } } },
          "400": { "description": "Invalid listing ID.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "401": { "description": "Session required.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "403": { "description": "Origin or CSRF rejected.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "404": { "description": "Listing not active or not found.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "503": { "description": "Database unavailable.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      },
      "delete": {
        "operationId": "removeFavorite",
        "parameters": [{ "$ref": "#/components/parameters/CSRFToken" }],
        "responses": {
          "200": { "description": "Current member no longer saves the listing.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/FavoriteResult" } } } },
          "400": { "description": "Invalid listing ID.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "401": { "description": "Session required.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "403": { "description": "Origin or CSRF rejected.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "503": { "description": "Database unavailable.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/api/v1/reviews": {
      "get": { "operationId": "listPendingReviews", "description": "Only an enrolled reviewer in the isolated test fixture can see pending listings and signed ready images.",
        "responses": {
          "200": { "description": "Pending listings.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PersonalListings" } } } },
          "401": { "$ref": "#/components/responses/SessionRequired" },
          "403": { "description": "Reviewer access required.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/api/v1/reviews/{id}/approve": {
      "post": { "operationId": "approveListing", "parameters": [{ "$ref": "#/components/parameters/ListingID" }, { "$ref": "#/components/parameters/CSRFToken" }],
        "description": "Database-authorized operator transitions pending_review to active; never provisions seller or inventory.",
        "responses": {
          "200": { "description": "Approved listing.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Listing" } } } },
          "400": { "$ref": "#/components/responses/InvalidRequest" },
          "401": { "$ref": "#/components/responses/SessionRequired" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" }
        }
      }
    },
    "/api/v1/reviews/{id}/reject": {
      "post": { "operationId": "rejectListing", "parameters": [{ "$ref": "#/components/parameters/ListingID" }, { "$ref": "#/components/parameters/CSRFToken" }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "type": "object", "required": ["reason"], "additionalProperties": false, "properties": { "reason": { "type": "string", "minLength": 1, "maxLength": 1000 } } } } } },
        "responses": {
          "200": { "description": "Rejected listing and audited reason.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Listing" } } } },
          "400": { "$ref": "#/components/responses/InvalidRequest" },
          "401": { "$ref": "#/components/responses/SessionRequired" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" }
        }
      }
    },
    "/api/v1/listings/{id}/resubmit": {
      "post": { "operationId": "resubmitListing", "parameters": [{ "$ref": "#/components/parameters/ListingID" }, { "$ref": "#/components/parameters/CSRFToken" }],
        "description": "Owner transitions rejected listing to pending_review after editing. Active listing and ready image changes remain forbidden.",
        "responses": {
          "200": { "description": "Submitted for re-review.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Listing" } } } },
          "401": { "$ref": "#/components/responses/SessionRequired" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" }
        }
      }
    },
    "/api/v1/listings/{id}/reviews": {
      "get": { "operationId": "getListingReviewHistory", "parameters": [{ "$ref": "#/components/parameters/ListingID" }],
        "responses": {
          "200": { "description": "Owner/reviewer audit history, newest first.", "content": { "application/json": { "schema": { "type": "object", "required": ["items"], "properties": { "items": { "type": "array", "items": { "$ref": "#/components/schemas/ReviewEvent" } } } } } } },
          "401": { "$ref": "#/components/responses/SessionRequired" },
          "404": { "$ref": "#/components/responses/NotFound" }
        }
      }
    },
    "/api/v1/listings/{id}/availability": {
      "get": { "operationId": "listingAvailability", "parameters": [{ "$ref": "#/components/parameters/ListingID" }],
        "responses": {
          "200": { "description": "Public listing eligibility; checked again atomically on order creation.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ListingAvailability" } } } },
          "404": { "$ref": "#/components/responses/NotFound" }
        }
      }
    },
    "/api/v1/listings": {
      "get": {
        "operationId": "listListings",
        "parameters": [
          {
            "name": "sport",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "surf",
                "tennis"
              ]
            }
          },
          {
            "name": "category",
            "in": "query",
            "schema": {
              "$ref": "#/components/schemas/ListingCategory"
            }
          },
          {
            "name": "search",
            "in": "query",
            "schema": {
              "type": "string",
              "maxLength": 120
            }
          },
          { "name": "location", "in": "query", "schema": { "type": "string", "maxLength": 160 } },
          { "name": "minPrice", "in": "query", "schema": { "type": "integer", "minimum": 0, "maximum": 999999999999 } },
          { "name": "maxPrice", "in": "query", "schema": { "type": "integer", "minimum": 0, "maximum": 999999999999 } },
          { "name": "sort", "in": "query", "schema": { "type": "string", "enum": ["recent", "price_asc", "price_desc"], "default": "recent" } },
          { "name": "limit", "in": "query", "schema": { "type": "integer", "minimum": 1, "maximum": 50, "default": 24 } },
          { "name": "cursor", "in": "query", "schema": { "type": "string", "maxLength": 1024 }, "description": "Opaque cursor bound to normalized filters and sort." }
        ],
        "responses": {
          "200": {
            "description": "Public active listings ordered by the requested sort and unique ID tie-breaker. No total count is calculated.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ListingList"
                }
              }
            }
          },
          "400": {
            "description": "Invalid filter.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      },
      "post": {
        "operationId": "createListing",
        "parameters": [
          {
            "$ref": "#/components/parameters/CSRFToken"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CreateListingRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Pending-review listing owned by the authenticated member.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Listing"
                }
              }
            }
          },
          "401": {
            "description": "Authentication required.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Origin or CSRF rejected.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/listings/{id}": {
      "get": {
        "operationId": "getListing",
        "parameters": [
          {
            "$ref": "#/components/parameters/ListingID"
          }
        ],
        "responses": {
          "200": {
            "description": "Active listing, or the authenticated owner's own non-public listing.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Listing"
                }
              }
            }
          },
          "404": {
            "description": "Not found or not visible to this requester.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      },
      "patch": {
        "operationId": "updateListing",
        "parameters": [
          {
            "$ref": "#/components/parameters/ListingID"
          },
          {
            "$ref": "#/components/parameters/CSRFToken"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/UpdateListingRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Owner-updated draft, pending-review, or rejected listing.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Listing"
                }
              }
            }
          },
          "404": {
            "description": "Not found or not owned by this member.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/listings/{id}/images": {
      "get": {
        "operationId": "listListingImages",
        "description": "Returns ten-minute signed URLs for an active listing, or for the authenticated owner's own non-public listing. Raw Storage object paths are never returned.",
        "parameters": [
          {
            "$ref": "#/components/parameters/ListingID"
          }
        ],
        "responses": {
          "200": {
            "description": "Visible ready images with short-lived private Storage URLs.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ListingImagesResponse"
                }
              }
            }
          },
          "404": {
            "description": "Listing is missing or not visible to this requester.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Image metadata or Storage signing is unavailable.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/listings/{id}/images/uploads": {
      "post": {
        "operationId": "createListingImageUpload",
        "description": "Authenticated owner only. Reserves image metadata and returns a signed upload URL for exactly one object in the existing private listing-images bucket.",
        "parameters": [
          {
            "$ref": "#/components/parameters/ListingID"
          },
          {
            "$ref": "#/components/parameters/CSRFToken"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ListingImageUploadRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Private upload slot created. The image is not readable until completion is verified.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ListingImageUploadSlot"
                }
              }
            }
          },
          "400": {
            "description": "Unsupported format, size, sort order, or metadata.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Authentication required.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Origin or CSRF rejected.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
