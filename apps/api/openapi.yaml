{
  "openapi": "3.1.0",
  "info": {
    "title": "SummerGear Go API",
    "version": "0.4.0",
    "description": "Go service-session authentication, listings, and private listing image lifecycle. Social provider credentials and Storage credentials may remain disabled in isolated test environments."
  },
  "paths": {
    "/health/live": {
      "get": {
        "operationId": "liveness",
        "responses": {
          "200": {
            "description": "Process is alive.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HealthLive"
                }
              }
            }
          }
        }
      }
    },
    "/health/ready": {
      "get": {
        "operationId": "readiness",
        "responses": {
          "200": {
            "description": "Database, auth tables, listings tables, and River foundation are ready.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HealthReady"
                }
              }
            }
          },
          "503": {
            "description": "Service is not ready.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/auth/providers": {
      "get": {
        "operationId": "authProviders",
        "responses": {
          "200": {
            "description": "Provider configuration status without credential values.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ProvidersResponse"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/auth/session": {
      "get": {
        "operationId": "authSession",
        "responses": {
          "200": {
            "description": "Current service session.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SessionView"
                }
              }
            }
          },
          "401": {
            "description": "No valid service session.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/auth/dev-login": {
      "post": {
        "operationId": "authDevLogin",
        "description": "Test-only login. The route is registered only when AUTH_DEV_LOGIN_ENABLED=true.",
        "responses": {
          "200": {
            "description": "Test member service session created or rotated.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SessionView"
                }
              }
            }
          },
          "403": {
            "description": "Origin rejected.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/auth/logout": {
      "post": {
        "operationId": "authLogout",
        "parameters": [
          {
            "$ref": "#/components/parameters/CSRFToken"
          }
        ],
        "responses": {
          "204": {
            "description": "Current service session revoked."
          },
          "401": {
            "description": "No valid service session.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Origin or CSRF rejected.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/auth/logout-all": {
      "post": {
        "operationId": "authLogoutAll",
        "parameters": [
          {
            "$ref": "#/components/parameters/CSRFToken"
          }
        ],
        "responses": {
          "204": {
            "description": "All member service sessions revoked after recent reauthentication."
          },
          "403": {
            "description": "Reauthentication, origin, or CSRF requirement not met.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/auth/reauthenticate": {
      "post": {
        "operationId": "authReauthenticate",
        "parameters": [
          {
            "$ref": "#/components/parameters/CSRFToken"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ReauthenticateRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Provider authorization URL for reauthentication.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuthorizationResponse"
                }
              }
            }
          },
          "401": {
            "description": "No valid service session.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/auth/{provider}/start": {
      "get": {
        "operationId": "authStart",
        "parameters": [
          {
            "$ref": "#/components/parameters/Provider"
          },
          {
            "name": "returnTo",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "pattern": "^/[A-Za-z0-9/_-]*$"
            }
          }
        ],
        "responses": {
          "303": {
            "description": "Redirect to the configured provider."
          },
          "503": {
            "description": "Provider is not configured.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/auth/{provider}/callback": {
      "get": {
        "operationId": "authCallback",
        "parameters": [
          {
            "$ref": "#/components/parameters/Provider"
          }
        ],
        "responses": {
          "303": {
            "description": "Return to the allowed application path with success or static error code."
          },
          "400": {
            "description": "Invalid state, browser binding, or provider response.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/listings": {
      "get": {
        "operationId": "listListings",
        "parameters": [
          {
            "name": "sport",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "surf",
                "tennis"
              ]
            }
          },
          {
            "name": "category",
            "in": "query",
            "schema": {
              "$ref": "#/components/schemas/ListingCategory"
            }
          },
          {
            "name": "search",
            "in": "query",
            "schema": {
              "type": "string",
              "maxLength": 120
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Public active Go-owned listings.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ListingList"
                }
              }
            }
          },
          "400": {
            "description": "Invalid filter.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      },
      "post": {
        "operationId": "createListing",
        "parameters": [
          {
            "$ref": "#/components/parameters/CSRFToken"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CreateListingRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Pending-review listing owned by the authenticated member.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Listing"
                }
              }
            }
          },
          "401": {
            "description": "Authentication required.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Origin or CSRF rejected.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/listings/{id}": {
      "get": {
        "operationId": "getListing",
        "parameters": [
          {
            "$ref": "#/components/parameters/ListingID"
          }
        ],
        "responses": {
          "200": {
            "description": "Active listing, or the authenticated owner's own non-public listing.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Listing"
                }
              }
            }
          },
          "404": {
            "description": "Not found or not visible to this requester.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      },
      "patch": {
        "operationId": "updateListing",
        "parameters": [
          {
            "$ref": "#/components/parameters/ListingID"
          },
          {
            "$ref": "#/components/parameters/CSRFToken"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/UpdateListingRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Owner-updated draft, pending-review, or rejected listing.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Listing"
                }
              }
            }
          },
          "404": {
            "description": "Not found or not owned by this member.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/listings/{id}/images": {
      "get": {
        "operationId": "listListingImages",
        "description": "Returns ten-minute signed URLs for an active listing, or for the authenticated owner's own non-public listing. Raw Storage object paths are never returned.",
        "parameters": [
          {
            "$ref": "#/components/parameters/ListingID"
          }
        ],
        "responses": {
          "200": {
            "description": "Visible ready images with short-lived private Storage URLs.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ListingImagesResponse"
                }
              }
            }
          },
          "404": {
            "description": "Listing is missing or not visible to this requester.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Image metadata or Storage signing is unavailable.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/listings/{id}/images/uploads": {
      "post": {
        "operationId": "createListingImageUpload",
        "description": "Authenticated owner only. Reserves image metadata and returns a signed upload URL for exactly one object in the existing private listing-images bucket.",
        "parameters": [
          {
            "$ref": "#/components/parameters/ListingID"
          },
          {
            "$ref": "#/components/parameters/CSRFToken"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ListingImageUploadRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Private upload slot created. The image is not readable until completion is verified.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ListingImageUploadSlot"
                }
              }
            }
          },
          "400": {
            "description": "Unsupported format, size, sort order, or metadata.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Authentication required.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Origin or CSRF rejected.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Listing or replacement image is missing or not owned by this member.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Image limit or image position conflict.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Image metadata or private Storage is unavailable.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/listings/{id}/images/{imageId}/complete": {
      "post": {
        "operationId": "completeListingImageUpload",
        "description": "Authenticated owner only. Verifies the uploaded private object MIME type and exact byte size before promoting metadata to ready.",
        "parameters": [
          {
            "$ref": "#/components/parameters/ListingID"
          },
          {
            "$ref": "#/components/parameters/ImageID"
          },
          {
            "$ref": "#/components/parameters/CSRFToken"
          }
        ],
        "responses": {
          "200": {
            "description": "Upload verified and image promoted to ready.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ListingImageCompleteResult"
                }
              }
            }
          },
          "400": {
            "description": "Uploaded object does not match the reserved image constraints.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Authentication required.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Origin or CSRF rejected.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Pending image is missing or not owned by this member.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Upload is incomplete or the target position conflicts.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "410": {
            "description": "Upload slot expired.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Image metadata or private Storage is unavailable.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/listings/{id}/images/{imageId}": {
      "delete": {
        "operationId": "deleteListingImage",
        "description": "Authenticated owner only. Hides metadata before deleting the private object; failed object deletion remains non-visible for a later retry.",
        "parameters": [
          {
            "$ref": "#/components/parameters/ListingID"
          },
          {
            "$ref": "#/components/parameters/ImageID"
          },
          {
            "$ref": "#/components/parameters/CSRFToken"
          }
        ],
        "responses": {
          "204": {
            "description": "Image deleted."
          },
          "401": {
            "description": "Authentication required.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Origin or CSRF rejected.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Image or listing is missing or not owned by this member.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Image metadata or private Storage deletion is unavailable.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "parameters": {
      "Provider": {
        "name": "provider",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "enum": [
            "naver",
            "kakao"
          ]
        }
      },
      "ListingID": {
        "name": "id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "CSRFToken": {
        "name": "X-CSRF-Token",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string"
        }
      },
      "ImageID": {
        "name": "imageId",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "required": [
          "code",
          "message",
          "requestId"
        ],
        "additionalProperties": false,
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "requestId": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          }
        }
      },
      "HealthLive": {
        "type": "object",
        "required": [
          "status"
        ],
        "additionalProperties": false,
        "properties": {
          "status": {
            "type": "string",
            "const": "ok"
          }
        }
      },
      "HealthReady": {
        "type": "object",
        "required": [
          "status"
        ],
        "additionalProperties": false,
        "properties": {
          "status": {
            "type": "string",
            "const": "ready"
          }
        }
      },
      "ProviderStatus": {
        "type": "object",
        "required": [
          "provider",
          "enabled",
          "missing"
        ],
        "additionalProperties": false,
        "properties": {
          "provider": {
            "type": "string",
            "enum": [
              "naver",
              "kakao"
            ]
          },
          "enabled": {
            "type": "boolean"
          },
          "missing": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        }
      },
      "ProvidersResponse": {
        "type": "object",
        "required": [
          "providers"
        ],
        "additionalProperties": false,
        "properties": {
          "providers": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ProviderStatus"
            }
          }
        }
      },
      "Member": {
        "type": "object",
        "required": [
          "id",
          "displayName",
          "email",
          "onboarded"
        ],
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "displayName": {
            "type": [
              "string",
              "null"
            ]
          },
          "email": {
            "type": [
              "string",
              "null"
            ]
          },
          "onboarded": {
            "type": "boolean"
          }
        }
      },
      "SessionInfo": {
        "type": "object",
        "required": [
          "expiresAt",
          "absoluteExpiresAt",
          "reauthenticatedAt"
        ],
        "additionalProperties": false,
        "properties": {
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          },
          "absoluteExpiresAt": {
            "type": "string",
            "format": "date-time"
          },
          "reauthenticatedAt": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          }
        }
      },
      "SessionView": {
        "type": "object",
        "required": [
          "member",
          "csrfToken",
          "session"
        ],
        "additionalProperties": false,
        "properties": {
          "member": {
            "$ref": "#/components/schemas/Member"
          },
          "csrfToken": {
            "type": "string"
          },
          "session": {
            "$ref": "#/components/schemas/SessionInfo"
          }
        }
      },
      "ReauthenticateRequest": {
        "type": "object",
        "required": [
          "provider",
          "returnTo"
        ],
        "additionalProperties": false,
        "properties": {
          "provider": {
            "type": "string",
            "enum": [
              "naver",
              "kakao"
            ]
          },
          "returnTo": {
            "type": "string"
          }
        }
      },
      "AuthorizationResponse": {
        "type": "object",
        "required": [
          "authorizationUrl"
        ],
        "additionalProperties": false,
        "properties": {
          "authorizationUrl": {
            "type": "string"
          }
        }
      },
      "ListingCategory": {
        "type": "string",
        "enum": [
          "equipment",
          "apparel",
          "footwear",
          "protective",
          "accessories",
          "other"
        ]
      },
      "ListingCondition": {
        "type": "string",
        "enum": [
          "new",
          "like_new",
          "good",
          "fair",
          "poor"
        ]
      },
      "ListingStatus": {
        "type": "string",
        "enum": [
          "draft",
          "pending_review",
          "rejected",
          "active",
          "reserved",
          "sold",
          "archived",
          "removed"
        ]
      },
      "ListingSeller": {
        "type": "object",
        "required": [
          "id",
          "displayName"
        ],
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "displayName": {
            "type": [
              "string",
              "null"
            ]
          }
        }
      },
      "Listing": {
        "type": "object",
        "required": [
          "id",
          "seller",
          "sport",
          "category",
          "title",
          "description",
          "priceKrw",
          "condition",
          "status",
          "details",
          "location",
          "publishedAt",
          "createdAt",
          "updatedAt",
          "images"
        ],
        "additionalProperties": false,
        "properties": {
