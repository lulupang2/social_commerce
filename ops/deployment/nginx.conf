pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  # Do not log OAuth codes, signed URLs, cookies, or query strings.
  log_format safe '$request_method $uri $status';
  access_log /dev/stdout safe;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  # Docker service addresses can change during an update or rollback.
  resolver 127.0.0.11 valid=5s ipv6=off;
  map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
  }
  server {
    listen 8080;
    set $api_upstream api:8080;
    set $web_upstream web:3000;
    client_max_body_size 11m;
    location = /health/live { return 200 'ok'; }
    location = /health/ready { proxy_pass http://$api_upstream/health/ready; }
    location /api/v1/ {
      proxy_pass http://$api_upstream;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_read_timeout 30s;
    }
    location / {
      proxy_pass http://$web_upstream;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_http_version 1.1;
      proxy_buffering off;
    }
  }
}
