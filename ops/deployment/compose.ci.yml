x-runtime: &runtime
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:size=32m,mode=1777"]
  stop_grace_period: 20s
  pids_limit: 128
  mem_limit: 192m
  cpus: 1
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  postgres:
    extends:
      file: ../nhn-rocky/compose.foundation-test.yml
      service: postgres

  checks:
    image: summergear-ci-go:deployment-ci
    profiles: [checks]
    environment:
      APP_ENV: test
      PAYMENT_MODE: test
      DB_TARGET: fixture
      DB_TARGET_ID: summergear-foundation-fixture-v1
      SUMMERGEAR_INTEGRATION: fixture
      DATABASE_URL: postgres://summergear_api:fixture_api@postgres:5432/summergear_foundation_test?sslmode=disable
      RIVER_DATABASE_URL: postgres://summergear_worker:fixture_worker@postgres:5432/summergear_foundation_test?sslmode=disable
      MIGRATION_DATABASE_URL: postgres://summergear_migrator:fixture_migrator@postgres:5432/summergear_foundation_test?sslmode=disable
      FIXTURE_FAST_JOBS: "true"
      API_ADDR: 127.0.0.1:18080
    command: [bash, /workspace/ops/deployment/check-db.sh]
    mem_limit: 1g
    cpus: 2
    depends_on:
      postgres: {condition: service_healthy}

  migration:
    <<: *runtime
    image: summergear-migration:deployment-ci
    environment:
      APP_ENV: test
      PAYMENT_MODE: test
      DB_TARGET: fixture
      DB_TARGET_ID: summergear-foundation-fixture-v1
      MIGRATION_DATABASE_URL: postgres://summergear_migrator:fixture_migrator@postgres:5432/summergear_foundation_test?sslmode=disable
    command: [--apply]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *runtime
    image: summergear-api:deployment-ci
    environment:
      APP_ENV: test
      PAYMENT_MODE: test
      DB_TARGET: fixture
      DB_TARGET_ID: summergear-foundation-fixture-v1
      DATABASE_URL: postgres://summergear_api:fixture_api@postgres:5432/summergear_foundation_test?sslmode=disable
      API_ADDR: 0.0.0.0:8080
      PUBLIC_WEB_URL: https://app.example.invalid
      AUTH_DEV_LOGIN_ENABLED: "true"
    depends_on:
      migration: {condition: service_completed_successfully}

  worker:
    <<: *runtime
    image: summergear-worker:deployment-ci
    environment:
      APP_ENV: test
      PAYMENT_MODE: test
      DB_TARGET: fixture
      DB_TARGET_ID: summergear-foundation-fixture-v1
      RIVER_DATABASE_URL: postgres://summergear_worker:fixture_worker@postgres:5432/summergear_foundation_test?sslmode=disable
      RIVER_MAX_WORKERS: "1"
    depends_on:
      migration: {condition: service_completed_successfully}

  web:
    <<: *runtime
    user: "1000:1000"
    image: summergear-web:deployment-ci
    mem_limit: 512m
    tmpfs: ["/tmp:size=32m,mode=1777", "/workspace/apps/web/.next/cache:size=64m,uid=1000,gid=1000"]
    depends_on:
      api: {condition: service_healthy}

  gateway:
    <<: *runtime
    image: nginx:1.28.0-alpine
    entrypoint: [nginx, -g, "daemon off;"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro,z
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health/ready]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_healthy}

networks:
  default:
    internal: true
volumes:
  fixture-data:
