name: Publish and deploy web

on:
  workflow_run:
    workflows: [Keyless Linux CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Never interrupt a container replacement when another commit arrives.
concurrency:
  group: summergear-preview-web
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}
    steps:
      - name: Ignore superseded commits
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$current" == "$SOURCE_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer main commit exists; skipping this release.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.current.outputs.deploy == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
        if: steps.current.outputs.deploy == 'true'
      - name: Select image name
        if: steps.current.outputs.deploy == 'true'
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}/web" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: steps.current.outputs.deploy == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish verified web source
        if: steps.current.outputs.deploy == 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/deployment/Dockerfile.web
          target: web
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=web-runtime
          cache-to: type=gha,scope=web-runtime,mode=max
      - name: Record immutable image
        if: steps.current.outputs.deploy == 'true'
        id: reference
        env:
          IMAGE: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
          DEPLOY_ENABLED: ${{ vars.WEB_DEPLOY_ENABLED }}
        run: |
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Published web image: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$DEPLOY_ENABLED" != true ]]; then
            echo 'SSH deployment is disabled. Complete ops/deployment/WEB-DEPLOY.md, then set WEB_DEPLOY_ENABLED=true and rerun this workflow.' >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: publish
    if: needs.publish.outputs.image != '' && vars.WEB_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    environment:
      name: preview-web
      url: https://sg.jisung.lol
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Deploy web over verified SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GH_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          WEB_IMAGE: ${{ needs.publish.outputs.image }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: bash ops/deployment/deploy-web-ssh.sh
